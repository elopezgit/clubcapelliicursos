<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script> fetch("https://docs.google.com/spreadsheets/d/1RhMtB7PznB89qWIq0R7DOwFmE_TqS5Mh2OIEJuKCYZs/export?format=csv&gid=729153219").then(r=>r.text()).then(csvText => { const wb = XLSX.read(csvText, {type: "string"}); const ws = wb.Sheets[wb.SheetNames[0]]; const data = XLSX.utils.sheet_to_json(ws); console.log(data.length); document.body.innerText = "Parsed " + data.length + " rows. First row: " + JSON.stringify(data[0]); }).catch(e => { document.body.innerText = "ERROR: " + e.message; }) </script>
